name: Release

run-name: Release new version

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_PYTHON: "3.13"
  # Keep this aligned with ida-hcli's release workflow.
  UV_VERSION: "0.10.6"

jobs:
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python with uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install "$UV_PYTHON"

      - name: Bump every package and plugin version
        id: version
        run: |
          VERSION=$(uv run --no-project python .github/bump_version.py --bump)
          uv run --no-project python .github/bump_version.py --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Created version: $VERSION"

      - name: Build distributions
        run: uv build

      - name: Build IDA plugin archive
        run: |
          mkdir -p release-assets
          uv run --no-project python -m zipfile -c \
            "release-assets/ida-mcp-plugin-$VERSION.zip" \
            ida-plugin.json ida_mcp_plugin.py README.md
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Commit and tag version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json package-lock.json pyproject.toml uv.lock \
            ida-plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json \
            .github/plugin/plugin.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Expected the version bump to change the managed files" >&2
            exit 1
          fi
          git commit -m "$VERSION"
          git tag "$TAG"
          gh auth setup-git
          git push --atomic origin \
            "HEAD:$GITHUB_REF_NAME" \
            "refs/tags/$TAG" \
            "+refs/tags/$TAG:refs/heads/latest"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}

      # Generates the PEP 740 .publish.attestation files that uv publish uploads
      # alongside each distribution. Early-stage action, so the pin is deliberate.
      - name: Attest distributions
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027 # v0.0.6

      - name: Publish to PyPI
        run: uv publish

      - name: Create GitHub release
        run: |
          gh release create "$TAG" dist/*.whl dist/*.tar.gz release-assets/* \
            --verify-tag --generate-notes --title "$TAG" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
