[project]
name = "ida-mcp"
version = "0.8.1"
description = "Official Hex-Rays IDA MCP Server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ida-nexus>=0.8.1",
]

[project.scripts]
ida-mcp = "ida_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ida-plugin.json",
    "ida_mcp_plugin.py",
    "ida_mcp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# IDAPython modules provide type information but are importable only inside IDA.
reportMissingModuleSource = "none"
