[project]
name = "ida-mcp"
version = "2026.915.2"
description = "Official Hex-Rays IDA MCP Server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "ida-nexus>=0.11.1",
]

[project.urls]
Repository = "https://github.com/HexRaysSA/ida-mcp"
Issues = "https://github.com/HexRaysSA/ida-mcp/issues"

[project.scripts]
ida-mcp = "ida_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ida_mcp"]
