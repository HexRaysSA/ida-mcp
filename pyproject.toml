[project]
name = "ida-mcp"
version = "20260923.0.2"
description = "Official Hex-Rays IDA MCP Server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "packaging",
    "ida-nexus>=0.13.0",
    "zeromcp>=1.10.3",
]

[project.urls]
Repository = "https://github.com/HexRaysSA/ida-mcp"
Issues = "https://github.com/HexRaysSA/ida-mcp/issues"

[project.scripts]
ida-mcp = "ida_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.0",
    "ty>=0.0.83",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["ida_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
