[project]
name = "ida-mcp"
version = "0.8.0"
description = "Official Hex-Rays IDA MCP Server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ida-nexus>=0.8.0",
]

[project.scripts]
ida-mcp = "ida_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "ida-plugin.json",
    "ida_mcp_plugin.py",
    "ida_mcp",
]
